# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: SSYin-yg/Firefly
  branch: master
  base_url: https://cms.ssyin033.top

media_folder: "public"
public_folder: "/"

collections:
  # 文章
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "src/content/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "描述", name: "description", widget: "text", required: false }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "置顶", name: "pinned", widget: "boolean", default: false }
      - { label: "允许评论", name: "comment", widget: "boolean", default: true }
      - { label: "正文", name: "body", widget: "markdown" }

  # 动态
  - name: "dynamic"
    label: "动态"
    label_singular: "动态"
    folder: "src/content/dynamic"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - { label: "发布日期", name: "published", widget: "datetime" }
      - { label: "置顶", name: "pinned", widget: "boolean", default: false }
      - { label: "位置", name: "location", widget: "string", required: false }
      - { label: "内容", name: "body", widget: "markdown" }

  # 界面设置（下拉 + 调色）
  - name: "ui-settings"
    label: "界面设置"
    label_singular: "设置"
    editor:
      preview: false
    files:
      - name: "uiSettings"
        label: "布局与配色（推荐使用）"
        file: "src/config/uiSettings.json"
        format: "json"
        fields:
          - label: "主题色相 (0-360)"
            name: "themeHue"
            widget: "number"
            min: 0
            max: 360
            step: 1
            hint: "红色0，青色200，蓝绿250，粉色345，当前默认165"

          - label: "默认亮暗模式"
            name: "defaultMode"
            widget: "select"
            options:
              - { label: "跟随系统", value: "system" }
              - { label: "亮色", value: "light" }
              - { label: "暗色", value: "dark" }

          - label: "页面宽度 (rem)"
            name: "pageWidth"
            widget: "number"
            min: 60
            max: 140
            step: 5

          - label: "卡片边框与阴影"
            name: "cardBorder"
            widget: "boolean"

          - label: "卡片跟随主题色"
            name: "cardFollowTheme"
            widget: "boolean"

          - label: "侧边栏位置"
            name: "sidebarPosition"
            widget: "select"
            options:
              - { label: "仅左侧", value: "left" }
              - { label: "仅右侧", value: "right" }
              - { label: "双侧边栏", value: "both" }

          - label: "平板端显示哪侧侧边栏"
            name: "tabletSidebar"
            widget: "select"
            options:
              - { label: "左侧", value: "left" }
              - { label: "右侧", value: "right" }

          - label: "文章页隐藏侧边栏"
            name: "hideSidebarOnPostPage"
            widget: "boolean"

          - label: "壁纸模式"
            name: "wallpaperMode"
            widget: "select"
            options:
              - { label: "横幅壁纸", value: "banner" }
              - { label: "全屏壁纸", value: "fullscreen" }
              - { label: "透明覆盖", value: "overlay" }
              - { label: "纯色背景", value: "none" }

      # 高级：直接编辑原始 TS 配置（不建议普通用户使用）
      - name: "siteConfig"
        label: "[高级] siteConfig.ts"
        file: "src/config/siteConfig.ts"
        format: "raw"
        fields:
          - { name: "body", label: "配置内容", widget: "code", default_language: "typescript", allow_language_selection: false, output_code_only: true }

      - name: "sidebarConfig"
        label: "[高级] sidebarConfig.ts"
        file: "src/config/sidebarConfig.ts"
        format: "raw"
        fields:
          - { name: "body", label: "配置内容", widget: "code", default_language: "typescript", allow_language_selection: false, output_code_only: true }

      - name: "backgroundWallpaper"
        label: "[高级] backgroundWallpaper.ts"
        file: "src/config/backgroundWallpaper.ts"
        format: "raw"
        fields:
          - { name: "body", label: "配置内容", widget: "code", default_language: "typescript", allow_language_selection: false, output_code_only: true }
